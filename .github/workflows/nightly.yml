name: Nightly data refresh

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-data-refresh
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Export aggregate data with the read-only account
        env:
          KUMQUAT_READONLY_DSN: ${{ secrets.KUMQUAT_READONLY_DSN }}
        run: uv run go-vote-export --output-dir generated-data --baseline-dir docs/data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-aggregate-csvs
          path: generated-data/*.csv
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weekly-aggregate-csvs
          path: generated-data
      - name: Revalidate against the latest published baseline
        run: |
          git pull --ff-only origin main
          uv run go-vote-validate --candidate-dir generated-data --baseline-dir docs/data
      - name: Publish changed CSVs
        run: |
          rm -rf docs/data
          mv generated-data docs/data
          git add docs/data
          if git diff --cached --quiet; then
            echo "No aggregate data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh weekly GO Vote aggregates"
          git push
