name: Nightly data refresh

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-data-refresh
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Export aggregate data with the read-only account
        env:
          KUMQUAT_READONLY_DSN: ${{ secrets.KUMQUAT_READONLY_DSN }}
        run: uv run go-vote-export --output-dir generated-data --baseline-dir reports/2026-04-01_to_2026-08-06T051200Z
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-aggregate-csvs
          path: generated-data/*.csv
          if-no-files-found: error
          retention-days: 1

  # Publishes to nexus (https://kumquat.link/dashboards/go-vote/), readable
  # only behind GitHub sign-in. Never committed or served by GitHub Pages: this repo is
  # public, so anything committed here is public. This job never receives
  # the database secret, and the ingest token can only replace the data.
  publish:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weekly-aggregate-csvs
          path: generated-data
      - name: Revalidate against the frozen baseline
        run: uv run go-vote-validate --candidate-dir generated-data --baseline-dir reports/2026-04-01_to_2026-08-06T051200Z
      - name: Publish to the private nexus dashboard
        env:
          GO_VOTE_INGEST_TOKEN: ${{ secrets.GO_VOTE_INGEST_TOKEN }}
        run: uv run go-vote-publish --data-dir generated-data
